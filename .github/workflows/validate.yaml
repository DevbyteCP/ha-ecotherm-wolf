name: HACS und Home Assistant

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: HACS-Voraussetzungen prüfen
        uses: hacs/action@main
        with:
          category: integration
          comment: false

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Integration prüfen
        uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests ohne Heizungszugriff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Test-Abhängigkeiten installieren
        run: >-
          python -m pip install
          "homeassistant>=2025.10.0"
          "pytest-homeassistant-custom-component>=0.13"
          "lxml>=5.0" "cryptography>=42.0"
      - name: Verwendete Versionen anzeigen
        run: python -m pip list
      - name: Wolf-Dateien für die Tests holen (zivillian/ism7mqtt, SHA-256-geprüft)
        run: python scripts/fetch_wolf_files.py --bundled
      - name: Tests mit simuliertem Gateway ausführen
        run: python -m pytest
